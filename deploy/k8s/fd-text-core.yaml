apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-text-core
  namespace: fd-prod
  labels:
    app: fd-text-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fd-text-core
  template:
    metadata:
      labels:
        app: fd-text-core
    spec:
      containers:
        - name: fd-text-core
          # 快照 sha（通用构建池 testaction005/build-pool 线）——
          # 对应真源 dfe0091（263155c 全部内容 + 嵌入客户端瞬时故障重试）。
          # 2026-10-22 出片。上一版 sha-1806fe5 对应真源 263155c。
          # 2026-11-12 sha-abbe929：线自有共享 bearer 门（change converge-line-identity-and-keys 8.6），
          # 快照源真 aa715e77（含 fd_text_core/auth.py + 服务入口的 serve_http 分支）。
          # 2026-11-13 sha-f3a2fc0：三处 facet 修复 + facet 覆盖门。快照源真 890e383d5
          # （13f61e2 facet 覆盖门 / 57c3c68 origin column 模式 / fcf2187 news has_body /
          #  fbef517 papers cat→categories）；回滚=sha-abbe929
          # 2026-11-13 sha-75eaf30：+ 读取分页无损修复（b08731b：next_offset 曾取末块
          # char_end，被 limit 截掉的尾巴按游标续读拿不回来——news 1748/5083 篇、
          # screenplay 17/17 篇受影响）；同时片里补上 tool-surface.json（c9612dd）。
          # 快照源真 b08731ba9；回滚=sha-7942eec
          image: ccr.ccs.tencentyun.com/finddata/fd-text-core:sha-75eaf30
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: fd-text-core-env
          env:
            # 8.6 翻转第二步：与注册表 backend auth 的 auth_credential 逐字节相同
            # （注册表在出口把 Authorization 换成这把令牌；本线门按 Bearer 精确比较）。
            # 未设=门不存在（与接入前逐字节一致）；设了才生效。值只在 Secret 里。
            # 唯一的内部消费者 fd-info 已先在 FD_TEXT_CORE_TOKEN 配了同一个值
            # （textcore_search.py:127 本来就发 `Authorization: Bearer <token>`）。
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fd-text-core-line-token
                  key: MCP_BEARER_TOKEN
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # MCP 端点只接受 POST/GET+升级头的流请求，裸 GET 返回 400。
          # 探针因此不能用 httpGet /mcp（否则被判失败并反复重启，实测撞过），
          # 改用 TCP 探活：能建连即视为在侦听。
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fd-text-core
  namespace: fd-prod
  labels:
    app: fd-text-core
spec:
  type: NodePort
  selector:
    app: fd-text-core
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 31887
