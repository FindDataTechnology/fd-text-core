apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-text-core
  namespace: fd-prod
  labels:
    app: fd-text-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fd-text-core
  template:
    metadata:
      labels:
        app: fd-text-core
    spec:
      containers:
        - name: fd-text-core
          image: ccr.ccs.tencentyun.com/finddata/fd-text-core:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: fd-text-core-env
          env:
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /mcp
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /mcp
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fd-text-core
  namespace: fd-prod
  labels:
    app: fd-text-core
spec:
  type: NodePort
  selector:
    app: fd-text-core
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 31887
