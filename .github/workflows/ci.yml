# fd-text-core CI：测试 + 质量门 + 越界守门
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 2026-10-12 起必须真正卡住失败（原先带 `|| true` 使 lint 从未守过门，
      # 见 change text-foundation-remediation task 1.5）。
      - name: Ruff
        run: ruff check fd_text_core scripts

      - name: Tests
        env:
          FDTEXT_DATABASE_URL: ${{ secrets.FDTEXT_DATABASE_URL }}
        run: pytest -q

      - name: Conformance gate（含垂域越界检查）
        env:
          FDTEXT_DATABASE_URL: ${{ secrets.FDTEXT_DATABASE_URL }}
          FDTEXT_S3_ENDPOINT: ${{ secrets.FDTEXT_S3_ENDPOINT }}
          FDTEXT_S3_ACCESS_KEY: ${{ secrets.FDTEXT_S3_ACCESS_KEY }}
          FDTEXT_S3_SECRET_KEY: ${{ secrets.FDTEXT_S3_SECRET_KEY }}
          FDTEXT_S3_BUCKET: fd-text
        run: python scripts/conformance_gate.py --changed-base origin/main
