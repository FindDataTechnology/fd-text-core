apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-text-core
  namespace: fd-prod
  labels:
    app: fd-text-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fd-text-core
  template:
    metadata:
      labels:
        app: fd-text-core
    spec:
      containers:
        - name: fd-text-core
          # 快照 sha（通用构建池 testaction005/build-pool 线）——
          # 对应真源 263155c（KG 车道挂载 + 图库/嵌入凭据 + 镜像装 kg extra，
          # change kg-lane-delivery-v1 收尾）。2026-10-22 出片。
          # 上一版 sha-3283213 对应真源 39b1188（2026-10-19）。
          image: ccr.ccs.tencentyun.com/finddata/fd-text-core:sha-1806fe5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: fd-text-core-env
          env:
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # MCP 端点只接受 POST/GET+升级头的流请求，裸 GET 返回 400。
          # 探针因此不能用 httpGet /mcp（否则被判失败并反复重启，实测撞过），
          # 改用 TCP 探活：能建连即视为在侦听。
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fd-text-core
  namespace: fd-prod
  labels:
    app: fd-text-core
spec:
  type: NodePort
  selector:
    app: fd-text-core
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 31887
