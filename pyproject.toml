[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-text-core"
version = "0.1.0"
description = "通用文本处理引擎：摄取/结构化/索引/查询一体化底座，垂域以配置接入。纯基础设施，无产品面。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastmcp>=2.0",
    "click",
    "uvicorn",
    "httpx",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "boto3",
    "zstandard",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
# 2026-10-12 删除 `fd-text-core = "fd_text_core.cli:cli"`：该入口指向的
# fd_text_core/cli.py 从未存在（声明报废），且全仓无任何调用（grep 确认）。
# 实际在用的入口是下面的 fd-text-gate（质量门）。见 change text-foundation-remediation。
fd-text-gate = "scripts.conformance_gate:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fd_text_core*"]

# t2s.json = 繁→简映射（OpenCC TSCharacters，Apache-2.0）。归一表必须随包走：
# 引擎每次分词都读它，缺表会让繁简互查静默退化为 0 命中（见 tokenize.fold_t2s）。
[tool.setuptools.package-data]
fd_text_core = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
