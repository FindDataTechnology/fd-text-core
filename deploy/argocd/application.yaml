apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fd-text-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitee.com/FindDataTechnology/fd-text-core.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
